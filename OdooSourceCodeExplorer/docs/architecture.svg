<text x="40" y="54" class="h">Odoo Source Code Explorer — Thinking OFF</text>
<text x="40" y="82" class="sub">Quick answer: a local AI model finds the matching code, then GitHub Copilot writes the answer in one call.</text>
<rect x="50" y="200" width="200" height="130" rx="14" fill="#fff" stroke="#6B7280" stroke-width="2.5"/>
<text x="150.0" y="238" class="t" text-anchor="middle">User</text>
<text x="150.0" y="264" class="s" text-anchor="middle">Asks a question</text>
<text x="150.0" y="285" class="s" text-anchor="middle">in the browser</text>
<rect x="320" y="130" width="440" height="430" rx="16" fill="#F0FAF8" stroke="#0E9384" stroke-width="2.5"/>
<text x="540" y="170" class="t" text-anchor="middle">Chat app</text>
<text x="540" y="198" class="s" text-anchor="middle">Takes the question</text>
<text x="540" y="220" class="s" text-anchor="middle">Finds the matching code</text>
<text x="540" y="242" class="s" text-anchor="middle">Sends question + code to Copilot</text>
<text x="540" y="264" class="s" text-anchor="middle">Checks the answer</text>
<rect x="350" y="400" width="380" height="130" rx="14" fill="#fff" stroke="#2563EB" stroke-width="2.5"/>
<text x="540.0" y="438" class="t" text-anchor="middle">Local AI model</text>
<text x="540.0" y="464" class="s" text-anchor="middle">Ollama · nomic-embed-text</text>
<text x="540.0" y="485" class="s" text-anchor="middle">Runs on your machine</text>
<text x="540.0" y="506" class="s" text-anchor="middle">Turns text into search vectors</text>
<rect x="860" y="200" width="390" height="130" rx="14" fill="#fff" stroke="#6B7280" stroke-width="2.5"/>
<text x="1055.0" y="238" class="t" text-anchor="middle">GitHub Copilot</text>
<text x="1055.0" y="264" class="s" text-anchor="middle">Cloud AI model</text>
<text x="1055.0" y="285" class="s" text-anchor="middle">Writes the answer in one call</text>
<rect x="860" y="400" width="180" height="130" rx="14" fill="#fff" stroke="#0E9384" stroke-width="2.5"/>
<text x="950.0" y="438" class="t" text-anchor="middle">Search index</text>
<text x="950.0" y="464" class="s" text-anchor="middle">Code chunks</text>
<text x="950.0" y="485" class="s" text-anchor="middle">Qdrant · SQLite</text>
<rect x="1070" y="400" width="180" height="130" rx="14" fill="#fff" stroke="#D97706" stroke-width="2.5"/>
<text x="1160.0" y="438" class="t" text-anchor="middle">Indexer</text>
<text x="1160.0" y="464" class="s" text-anchor="middle">Splits code into chunks</text>
<text x="1160.0" y="485" class="s" text-anchor="middle">using the local model</text>
<text x="1160.0" y="506" class="s" text-anchor="middle">(prepared in advance)</text>
<rect x="1070" y="600" width="180" height="110" rx="14" fill="#fff" stroke="#D97706" stroke-width="2.5"/>
<text x="1160.0" y="638" class="t" text-anchor="middle">Odoo source code</text>
<text x="1160.0" y="664" class="s" text-anchor="middle">Local Git checkout</text>
